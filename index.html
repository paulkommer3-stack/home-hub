    // --- HELPER FUNCTIONS ---
    function copyTextToClipboard(text) {
      const fallbackCopy = (str) => {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = str;
          textArea.style.position = "fixed";
          textArea.style.left = "-9999px";
          textArea.style.top = "0";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function ChoresView({ chores, setChores, setChoreModal, showToast }) {
      const [filter, setFilter] = useState('All');
      const [roomFilter, setRoomFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      const toggleChore = (id) => {
        setChores(chores.map(c => c.id === id ? { ...c, completed: !c.completed } : c));
        showToast('Chore status updated');
      };

      const deleteChore = (id) => {
        setChores(chores.filter(c => c.id !== id));
        showToast('Chore deleted');
      };

      const filteredChores = useMemo(() => {
        return chores.filter(chore => {
          if (filter === 'Due Today' && chore.dueDate !== 'Today') return false;
          if (filter === 'High Priority' && chore.priority !== 'High') return false;
          if (filter === 'Completed' && !chore.completed) return false;
          if (filter === 'Pending' && chore.completed) return false;

          if (roomFilter !== 'All' && chore.room !== roomFilter) return false;
          if (searchQuery && !chore.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;

          return true;
        });
      }, [chores, filter, roomFilter, searchQuery]);

      const rooms = ['All', 'Kitchen', 'Living Room', 'Bathroom', 'Bedroom', 'Yard', 'Garage', 'General'];

      return (
        <div className="space-y-6 max-w-7xl mx-auto">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Chores & Household Maintenance</h1>
              <p className="text-slate-500 text-sm">Keep your home spotless and maintain recurring tasks efficiently.</p>
            </div>
            <button 
              onClick={() => setChoreModal({ open: true, item: null })}
              className="px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm rounded-xl transition shadow flex items-center justify-center gap-2"
            >
              <i className="fa-solid fa-plus"></i> Add New Task

          </div>

          <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/80 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex flex-wrap gap-1.5 w-full md:w-auto">
              {['All', 'Pending', 'Due Today', 'High Priority', 'Completed'].map(f => (
                <button
                  key={f}
                  onClick={() => setFilter(f)}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-xl transition ${
                    filter === f 
                      ? 'bg-brand-600 text-white shadow-sm' 
                      : 'bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                  }`}
                >
                  {f}
                </button>
              ))}
            </div>

            <div className="flex items-center space-x-3 w-full md:w-auto">
              <select 
                value={roomFilter} 
                onChange={(e) => setRoomFilter(e.target.value)}
                className="px-3 py-2 text-xs font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 focus:outline-none"
              >
                {rooms.map(r => (
                  <option key={r} value={r}>Room: {r}</option>
                ))}
              </select>

              <div className="relative flex-1 md:w-56">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                <input 
                  type="text" 
                  placeholder="Search tasks..." 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 focus:outline-none"
                />
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredChores.length === 0 ? (
              <div className="col-span-full bg-white dark:bg-slate-800 rounded-2xl p-8 text-center border border-slate-200 dark:border-slate-700">

                <p className="text-slate-500 font-medium text-sm">No tasks match your current filters.</p>
              </div>
            ) : (
              filteredChores.map(chore => (
                <div 
                  key={chore.id} 
                  className={`p-4 rounded-2xl border transition-all duration-200 bg-white dark:bg-slate-800 flex flex-col justify-between ${
                    chore.completed ? 'opacity-60 border-slate-200 dark:border-slate-800' : 'border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md'
                  }`}
                >
                  <div>
                    <div className="flex items-start justify-between gap-2 mb-2">
                      <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                        {chore.room}
                      </span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                        chore.priority === 'High' ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400' :
                        chore.priority === 'Medium' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400' :
                        'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'
                      }`}>
                        {chore.priority}
                      </span>
                    </div>

                    <h3 className={`text-sm font-bold mt-1 ${chore.completed ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'}`}>

                    <div className="text-xs text-slate-400 space-x-2">
                      <span><i className="fa-solid fa-repeat mr-1"></i>{chore.frequency}</span>
                      <span>•</span>
                      <span>{chore.dueDate}</span>
                    </div>

                    <div className="flex items-center space-x-2">
                      <button 
                        onClick={() => toggleChore(chore.id)}
                        className={`p-1.5 rounded-lg text-xs font-semibold transition ${
                          chore.completed 
                            ? 'bg-slate-100 text-slate-500 hover:bg-slate-200' 
                            : 'bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 hover:bg-brand-100'
                        }`}
                        title={chore.completed ? 'Mark pending' : 'Mark complete'}
                      >
                        <i className={`fa-solid ${chore.completed ? 'fa-rotate-left' : 'fa-check'}`}></i>
                      </button>
                      <button 
                        onClick={() => setChoreModal({ open: true, item: chore })}
                        className="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white text-xs"
                      >
                        <i className="fa-solid fa-pen"></i>
                      </button>
                      <button 
                        onClick={() => deleteChore(chore.id)}
                        className="p-1.5 text-slate-400 hover:text-red-500 text-xs"
                      >
                        <i className="fa-solid fa-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );

                    >
                      <div className="p-5">
                        <div className="flex items-center justify-between mb-3">
                          <span className="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300">
                            {recipe.category}

                          <span className="text-xs text-slate-400">

                      <div className="px-5 py-3 bg-slate-50 dark:bg-slate-800/60 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                        <button 
                          onClick={() => setRecipeDetailModal({ open: true, recipe })}
                          className="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline"

                          View Recipe &rarr;

                        <div className="flex items-center space-x-2">

                            className="p-1.5 text-slate-400 hover:text-brand-600 text-xs"
                            title="Add ingredients to grocery list"
                          >
                            <i className="fa-solid fa-cart-plus"></i>
                          </button>
                          <button 
                            onClick={() => setRecipeModal({ open: true, item: recipe })}
                            className="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white text-xs"
                          >
                            <i className="fa-solid fa-pen"></i>
                          </button>
                          <button 
                            onClick={() => deleteRecipe(recipe.id)}

                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {subTab === 'planner' && (
            <div className="space-y-4">
              <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 flex items-center justify-between">
                <span className="text-xs font-bold text-slate-500 uppercase">Weekly Dinner & Meal Schedule</span>
                <button 
                  onClick={() => {
                    let count = 0;
                    Object.values(mealPlan).forEach(day => {
                      ['breakfast', 'lunch', 'dinner'].forEach(m => {
                        const title = day[m];
                        const found = recipes.find(r => r.title.toLowerCase() === title.toLowerCase());
                        if (found) {
                          handleAddIngredientsToGroceries(found);
                          count++;
                        }
                      });
                    });
                    if (count === 0) showToast('No saved recipes detected in week plan to export.');
                  }}

                >
                  <i className="fa-solid fa-cart-arrow-down mr-1"></i> Add Planned Meals to Groceries
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-3">
                {daysOfWeek.map(day => {
                  const plan = mealPlan[day] || { breakfast: '', lunch: '', dinner: '' };
                  return (
                    <div key={day} className="bg-white dark:bg-slate-800 rounded-2xl p-3 border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                      <div className="border-b border-slate-100 dark:border-slate-700 pb-2 mb-2 text-center">
                        <span className="font-extrabold text-xs uppercase text-brand-600 dark:text-brand-400">{day}</span>
                      </div>

                      <div className="space-y-2 text-xs">
                        <div>
                          <label className="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Breakfast</label>
                          <input 
                            type="text" 
                            value={plan.breakfast}
                            onChange={(e) => updateMealPlan(day, 'breakfast', e.target.value)}
                            placeholder="Meal..."
                            className="w-full p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 text-xs"
                          />
                        </div>

                        <div>
                          <label className="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Lunch</label>
                          <input 
                            type="text" 
                            value={plan.lunch}
                            onChange={(e) => updateMealPlan(day, 'lunch', e.target.value)}
                            placeholder="Meal..."
                            className="w-full p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 text-xs"
                          />
                        </div>

                        <div>
                          <label className="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Dinner</label>
                          <input 
                            type="text"

                            className="w-full p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 text-xs font-semibold text-brand-700 dark:text-brand-400"
                          />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function GroceryView({ groceries, setGroceries, inventory, setInventory, showToast }) {
      const [subTab, setSubTab] = useState('shopping');
      
      const [newItemName, setNewItemName] = useState('');
      const [newItemQty, setNewItemQty] = useState('1');
      const [newItemCat, setNewItemCat] = useState('Produce');

      const [masterName, setMasterName] = useState('');
      const [masterQty, setMasterQty] = useState('1');
      const [masterCat, setMasterCat] = useState('Produce');
      const [masterSearch, setMasterSearch] = useState('');
      const [masterCatFilter, setMasterCatFilter] = useState('All');

      const categories = ['Produce', 'Dairy & Eggs', 'Bakery', 'Meat & Seafood', 'Pantry', 'Household & Cleaning', 'Personal Care', 'Other'];

      const handleAddShoppingItem = (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;

        const item = {
          id: 'g_' + Date.now(),
          name: newItemName.trim(),
          quantity: newItemQty || '1',
          category: newItemCat,
          completed: false
        };

        setGroceries([item, ...groceries]);
        setNewItemName('');
        showToast(`Added ${item.name} to active list`);
      };

      const handleAddMasterItem = (e) => {
        e.preventDefault();
        if (!masterName.trim()) return;

        const masterItem = {
          id: 'inv_' + Date.now(),
          name: masterName.trim(),
          defaultQty: masterQty || '1',
          category: masterCat
        };

        setInventory([masterItem, ...inventory]);
        setMasterName('');
        showToast(`Saved "${masterItem.name}" to Master Inventory`);
      };

      const handleAddInventoryToShopping = (invItem) => {
        const existingUncompleted = groceries.find(
          g => g.name.toLowerCase() === invItem.name.toLowerCase() && !g.completed
        );

        if (existingUncompleted) {
          showToast(`"${invItem.name}" is already on your active shopping list!`);
          return;
        }

        const newGrocery = {
          id: 'g_' + Date.now() + Math.random().toString(36).substr(2, 4),
          name: invItem.name,
          quantity: invItem.defaultQty || '1',
          category: invItem.category || 'Other',
          completed: false
        };

        setGroceries([newGrocery, ...groceries]);
        showToast(`Added "${invItem.name}" to Grocery List`);
      };

      const deleteMasterItem = (id) => {
        setInventory(inventory.filter(inv => inv.id !== id));
        showToast('Removed item from Master Inventory');
      };

      const toggleItem = (id) => {
        setGroceries(groceries.map(g => g.id === id ? { ...g, completed: !g.completed } : g));
      };

      const deleteShoppingItem = (id) => {
        setGroceries(groceries.filter(g => g.id !== id));
      };

      const clearCompleted = () => {
        setGroceries(groceries.filter(g => !g.completed));
        showToast('Cleared completed items');
      };

      const totalCount = groceries.length;
      const completedCount = groceries.filter(g => g.completed).length;
      const progressPercent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      const filteredInventory = useMemo(() => {
        return (inventory || []).filter(inv => {
          if (masterCatFilter !== 'All' && inv.category !== masterCatFilter) return false;
          if (masterSearch && !inv.name.toLowerCase().includes(masterSearch.toLowerCase())) return false;
          return true;
        });
      }, [inventory, masterCatFilter, masterSearch]);

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Grocery & Household Inventory</h1>
              <p className="text-slate-500 text-sm">Manage active shopping trips and permanent household staples.</p>
            </div>

            <div className="flex items-center space-x-2">
              <div className="bg-slate-200 dark:bg-slate-800 p-1 rounded-xl flex">
                <button 
                  onClick={() => setSubTab('shopping')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${subTab === 'shopping' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500'}`}
                >
                  <i className="fa-solid fa-cart-shopping mr-1.5"></i> Active List ({groceries.filter(g => !g.completed).length})
                </button>
                <button 
                  onClick={() => setSubTab('inventory')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${subTab === 'inventory' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500'}`}
                >
                  <i className="fa-solid fa-boxes-stacked mr-1.5"></i> Master Inventory ({(inventory || []).length})
                </button>
              </div>

              {subTab === 'shopping' && completedCount > 0 && (
                <button 
                  onClick={clearCompleted}
                  className="px-3.5 py-1.5 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 dark:bg-red-950/30 dark:text-red-400 rounded-xl transition"
                >
                  <i className="fa-solid fa-trash mr-1"></i> Clear Done
                </button>
              )}
            </div>
          </div>

          {subTab === 'shopping' && (
            <div className="space-y-6">
              <form onSubmit={handleAddShoppingItem} className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row gap-3">
                <input 
                  type="text" 
                  placeholder="Add item for this trip (e.g., Whole Milk)..."
                  value={newItemName}
                  onChange={(e) => setNewItemName(e.target.value)}
                  className="flex-1 px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                <input 
                  type="text" 
                  placeholder="Qty (e.g. 2 L)"
                  value={newItemQty}
                  onChange={(e) => setNewItemQty(e.target.value)}
                  className="w-full md:w-32 px-3 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none"
                />
                <select 
                  value={newItemCat}
                  onChange={(e) => setNewItemCat(e.target.value)}
                  className="px-3 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none"
                >
                  {categories.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <button 
                  type="submit" 
                  className="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm rounded-xl transition shadow"
                >
                  Add Item
                </button>
              </form>

              <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <div className="flex items-center justify-between text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">
                  <span>Shopping Completion</span>
                  <span>{completedCount} of {totalCount} items ({progressPercent}%)</span>
                </div>
                <div className="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-brand-500 h-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                </div>
              </div>

              <div className="space-y-6">
                {groceries.length === 0 ? (
                  <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 text-center border border-slate-200 dark:border-slate-700">
                    <i className="fa-solid fa-basket-shopping text-3xl text-slate-300 mb-2"></i>
                    <p className="text-slate-500 font-medium text-sm">Your shopping list is empty.</p>
                    <button 
                      onClick={() => setSubTab('inventory')}
                      className="mt-3 px-4 py-2 bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold text-xs rounded-xl hover:bg-brand-100 transition"
                    >
                      Browse Master Household Inventory &rarr;
                    </button>
                  </div>
                ) : (
                  categories.map(cat => {
                    const catItems = groceries.filter(g => g.category === cat);
                    if (catItems.length === 0) return null;

                    return (
                      <div key={cat} className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm">
                        <div className="bg-slate-50 dark:bg-slate-900/60 px-4 py-2.5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                          <span className="text-xs font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                            {cat} ({catItems.length})
                          </span>
                        </div>

                        <div className="divide-y divide-slate-100 dark:divide-slate-700/60">
                          {catItems.map(item => (
                            <div 
                              key={item.id}
                              onClick={() => toggleItem(item.id)}
                              className="px-4 py-3 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/40 transition cursor-pointer"
                            >
                              <div className="flex items-center space-x-3">
                                <input 
                                  type="checkbox" 
                                  checked={item.completed}
                                  onChange={() => {}}
                                  className="w-5 h-5 rounded text-brand-600 focus:ring-brand-500 border-slate-300 dark:border-slate-600"
                                />
                                <span className={`text-sm font-medium ${item.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-200'}`}>
                                  {item.name}
                                </span>
                              </div>

                              <div className="flex items-center space-x-3">
                                <span className="text-xs text-slate-400 font-medium px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700">
                                  {item.quantity}
                                </span>
                                <button 
                                  onClick={(e) => { e.stopPropagation(); deleteShoppingItem(item.id); }}
                                  className="text-slate-300 hover:text-red-500 text-xs p-1"
                                >
                                  <i className="fa-solid fa-xmark"></i>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}

          {subTab === 'inventory' && (
            <div className="space-y-6">
              <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <h3 className="text-sm font-bold text-slate-900 dark:text-white mb-3">Add Permanent Household Item</h3>
                <form onSubmit={handleAddMasterItem} className="flex flex-col md:flex-row gap-3">
                  <input 
                    type="text" 
                    placeholder="Staple name (e.g., Dishwashing Liquid, Eggs)..."
                    value={masterName}
                    onChange={(e) => setMasterName(e.target.value)}
                    className="flex-1 px-4 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none"
                  />
                  <input 
                    type="text" 
                    placeholder="Default Qty (e.g., 1 pack)"
                    value={masterQty}
                    onChange={(e) => setMasterQty(e.target.value)}
                    className="w-full md:w-36 px-3 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none"
                  />
                  <select 
                    value={masterCat}
                    onChange={(e) => setMasterCat(e.target.value)}
                    className="px-3 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none"
                  >
                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <button 
                    type="submit" 
                    className="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs rounded-xl transition shadow flex items-center justify-center gap-1.5"
                  >
                    <i className="fa-solid fa-plus"></i> Save to Master List
                  </button>
                </form>
              </div>

              <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                <div className="flex flex-wrap gap-1.5 w-full md:w-auto">
                  {['All', ...categories].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setMasterCatFilter(cat)}
                      className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition ${
                        masterCatFilter === cat 
                          ? 'bg-brand-600 text-white shadow-sm' 
                          : 'bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                <div className="relative w-full md:w-56">
                  <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                  <input 
                    type="text" 
                    placeholder="Search master items..." 
                    value={masterSearch}
                    onChange={(e) => setMasterSearch(e.target.value)}
                    className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 focus:outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {filteredInventory.length === 0 ? (
                  <div className="col-span-full bg-white dark:bg-slate-800 rounded-2xl p-8 text-center border border-slate-200 dark:border-slate-700">
                    <p className="text-slate-500 font-medium text-sm">No items found in master inventory.</p>
                  </div>
                ) : (
                  filteredInventory.map(item => (
                    <div 
                      key={item.id}
                      className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition flex flex-col justify-between"
                    >
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                            {item.category}
                          </span>
                          <button 
                            onClick={() => deleteMasterItem(item.id)}
                            className="text-slate-300 hover:text-red-500 text-xs p-1"
                            title="Delete from master list"
                          >
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                        <h4 className="text-sm font-bold text-slate-900 dark:text-white">{item.name}</h4>
                        <p className="text-xs text-slate-400 mt-0.5">Default Qty: {item.defaultQty}</p>
                      </div>

                      <button 
                        onClick={() => handleAddInventoryToShopping(item)}
                        className="mt-4 w-full py-2 bg-brand-50 dark:bg-brand-900/30 hover:bg-brand-600 hover:text-white text-brand-700 dark:text-brand-400 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5"
                      >
                        <i className="fa-solid fa-plus"></i> Add to Grocery List
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function BillsView({ bills, setBills, setBillModal, showToast }) {

        setBills(bills.filter(b => b.id !== id));
        showToast('Bill removed');

      const totalMonthly = useMemo(() => bills.reduce((acc, b) => acc + b.amount, 0), [bills]);
      const totalPaid = useMemo(() => bills.filter(b => b.paid).reduce((acc, b) => acc + b.amount, 0), [bills]);
      const totalUnpaid = totalMonthly - totalPaid;

      return (
        <div className="space-y-6 max-w-7xl mx-auto">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">

              onClick={() => setBillModal({ open: true, item: null })}

              <span className="text-xs font-bold uppercase text-slate-400">Total Monthly Bills</span>
              <p className="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">{formatMoney(totalMonthly)}</p>
            </div>

            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
              <span className="text-xs font-bold uppercase text-emerald-600 dark:text-emerald-400">Total Paid This Month</span>
              <p className="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">{formatMoney(totalPaid)}</p>
            </div>

            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
              <span className="text-xs font-bold uppercase text-amber-600 dark:text-amber-400">Remaining Due</span>
              <p className="text-2xl font-extrabold text-amber-600 dark:text-amber-400 mt-1">{formatMoney(totalUnpaid)}</p>
            </div>
          </div>

              <table className="w-full text-left text-sm">

                    <th className="px-6 py-3.5">Provider / Bill Name</th>
                    <th className="px-6 py-3.5">Category</th>
                    <th className="px-6 py-3.5">Due Date</th>
                    <th className="px-6 py-3.5">Amount</th>
                    <th className="px-6 py-3.5">Status</th>
                    <th className="px-6 py-3.5 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-700/60">
                  {bills.map(bill => (
                    <tr key={bill.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                      <td className="px-6 py-4 font-bold text-slate-900 dark:text-white">

                      <td className="px-6 py-4">

                        {bill.dueDay}th of month

                      <td className="px-6 py-4 font-bold text-slate-900 dark:text-white">
                        {formatMoney(bill.amount)}
                      </td>
                      <td className="px-6 py-4">
                        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold ${
                          bill.paid 
                            ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400' 
                            : 'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400'

                          <i className="fa-solid fa-trash"></i>
