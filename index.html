      const [title, setTitle] = useState(item ? item.title : '');
      const [category, setCategory] = useState(item ? item.category : 'Tech');
      const [kvText, setKvText] = useState(() => {
        if (!item || !item.keyValues) return 'SSID: MyNetwork\nPassword: MySecretPassword';
        return Object.entries(item.keyValues).map(([k,v]) => `${k}: ${v}`).join('\n');
      });
      const [notes, setNotes] = useState(item ? item.notes : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        const keyValues = {};
        kvText.split('\n').forEach(line => {
          const parts = line.split(':');
          if (parts.length >= 2) {
            const k = parts[0].trim();
            const v = parts.slice(1).join(':').trim();
            if (k) keyValues[k] = v;
          }
        });

        onSave({
          ...(item || {}),
          title: title.trim(),
          category,
          keyValues,
          notes
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
            <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4">{item ? 'Edit Home Note' : 'Add Home Note'}</h3>
            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Card Title</label>
                <input type="text" required value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. WiFi & Network" className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white" />
              </div>
              <div>
                <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Category</label>
                <input type="text" value={category} onChange={(e) => setCategory(e.target.value)} placeholder="Tech, Services, Maintenance..." className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white" />
              </div>
              <div>
                <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Key Specs (Key: Value per line)</label>
                <textarea rows="4" value={kvText} onChange={(e) => setKvText(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white font-mono" />
              </div>
              <div>
                <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Additional Notes</label>
                <input type="text" value={notes} onChange={(e) => setNotes(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white" />
              </div>
              <div className="flex justify-end space-x-2 pt-3">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-500 font-semibold">Cancel</button>
                <button type="submit" className="px-4 py-2 bg-brand-600 text-white font-semibold rounded-xl">Save Note Card</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function LoginView({ family, onSelectUser, setMemberModal, setSyncModalOpen, syncStatus, syncPasscode }) {
      const [selectedMember, setSelectedMember] = useState(null);
      const [pin, setPin] = useState('');
      const [pinError, setPinError] = useState('');

      const handleUserClick = (member) => {
        if (member.pin) {
          setSelectedMember(member);
          setPin('');
          setPinError('');
        } else {
          onSelectUser(member);
        }
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (selectedMember && selectedMember.pin && pin !== selectedMember.pin) {
          setPinError('Incorrect PIN. Please try again.');
          return;
        }
        onSelectUser(selectedMember);
      };

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
          <div className="absolute -top-32 -left-32 w-96 h-96 bg-brand-500/20 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

          <div className="max-w-md w-full bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl relative z-10 text-center">
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 mx-auto flex items-center justify-center text-white text-2xl shadow-lg shadow-brand-500/30 mb-4">
              <i className="fa-solid fa-house-user"></i>
            </div>
            
            <h1 className="text-2xl font-extrabold text-white tracking-tight">Home Hub</h1>
            <p className="text-slate-400 text-xs mt-1 mb-6">Who is logging in today?</p>

            {selectedMember ? (
              <form onSubmit={handlePinSubmit} className="space-y-4 text-left">
                <div className="flex items-center justify-between p-3 rounded-2xl bg-slate-700/50 border border-slate-600 mb-2">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-brand-500 text-white font-bold flex items-center justify-center text-base">
                      {selectedMember.name.charAt(0)}
                    </div>
                    <div>
                      <p className="text-sm font-bold text-white">{selectedMember.name}</p>
                      <span className="text-[11px] text-slate-400">{selectedMember.relation}</span>
                    </div>
                  </div>
                  <button 
                    type="button" 
                    onClick={() => setSelectedMember(null)} 
                    className="text-xs text-brand-400 hover:underline font-semibold"
                  >
                    Change
                  </button>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-xs font-bold text-slate-300 flex items-center gap-1">
                      <i className="fa-solid fa-lock text-amber-400"></i> Enter Security PIN
                    </label>
                    <span className="text-[10px] text-slate-400">Sample PIN: 1234</span>
                  </div>
                  <input 
                    type="password" 
                    maxLength="6"
                    value={pin}
                    onChange={(e) => { setPin(e.target.value); setPinError(''); }}
                    placeholder="• • • •"
                    className="w-full text-center text-2xl tracking-widest p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 font-mono"
                    autoFocus
                  />
                  {pinError && <p className="text-red-400 text-xs mt-1 text-center font-medium">{pinError}</p>}
                </div>

                <button 
                  type="submit" 
                  className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm rounded-xl transition shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-key"></i> Confirm Login &rarr;
                </button>
              </form>
            ) : (
              <div className="space-y-3">
                <div className="grid grid-cols-1 gap-3 max-h-72 overflow-y-auto pr-1">
                  {(family || []).map(member => (
                    <button
                      key={member.id}
                      onClick={() => handleUserClick(member)}
                      className="flex items-center justify-between p-3.5 rounded-2xl bg-slate-700/40 hover:bg-slate-700/80 border border-slate-700/80 hover:border-brand-500/50 transition-all duration-200 group text-left"
                    >
                      <div className="flex items-center space-x-3.5">
                        <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-brand-500 to-emerald-600 text-white font-extrabold flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition-transform">
                          {member.name.charAt(0)}
                        </div>
                        <div>
                          <p className="text-sm font-bold text-white group-hover:text-brand-300 transition-colors">{member.name}</p>
                          <span className="text-xs text-slate-400">{member.relation}</span>
                        </div>
                      </div>
                      <div className="flex items-center space-x-2 text-slate-400 group-hover:text-white">
                        {member.pin ? (
                          <span className="text-[10px] font-semibold bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-md flex items-center gap-1 border border-amber-500/30">
                            <i className="fa-solid fa-lock text-[10px]"></i> PIN Protected
                          </span>
                        ) : (
                          <span className="text-[10px] font-semibold bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md">
                            1-Click Login
                          </span>
                        )}
                        <i className="fa-solid fa-chevron-right text-xs"></i>
                      </div>
                    </button>
                  ))}
                </div>

                <div className="pt-4 border-t border-slate-700/80 flex items-center justify-between text-xs">
                  <button 
                    onClick={() => setMemberModal({ open: true, item: null })}
                    className="text-brand-400 hover:text-brand-300 font-semibold flex items-center gap-1.5"
                  >
                    <i className="fa-solid fa-user-plus"></i> Add Family Member
                  </button>

                  <button 
                    onClick={() => setSyncModalOpen(true)}
                    className="text-slate-400 hover:text-white flex items-center gap-1.5"
                  >
                    <i className="fa-solid fa-cloud text-brand-500"></i>
                    <span>{syncPasscode ? `Sync: ${syncPasscode}` : 'Cloud Sync'}</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('home_hub_data_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_DATA;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('home_hub_active_user');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return null;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('home_hub_theme') === 'dark' || 
               (!('home_hub_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      });
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // --- HOUSEHOLD REAL-TIME SYNC STATE ---
      const [syncPasscode, setSyncPasscode] = useState(() => localStorage.getItem('home_hub_sync_code') || '');
      const [syncModalOpen, setSyncModalOpen] = useState(false);
      const [syncStatus, setSyncStatus] = useState('local');
      const [lastSyncedTime, setLastSyncedTime] = useState(null);

      const isRemoteUpdateRef = useRef(false);
      const isInitialSyncDoneRef = useRef(false);

      // Active Modals
      const [choreModal, setChoreModal] = useState({ open: false, item: null });
      const [recipeModal, setRecipeModal] = useState({ open: false, item: null });
      const [recipeDetailModal, setRecipeDetailModal] = useState({ open: false, recipe: null });
      const [billModal, setBillModal] = useState({ open: false, item: null });
      const [contactModal, setContactModal] = useState({ open: false, item: null });
      const [noteModal, setNoteModal] = useState({ open: false, item: null });
      const [memberModal, setMemberModal] = useState({ open: false, item: null });
      const [petModal, setPetModal] = useState({ open: false, item: null });
      const [resetConfirmOpen, setResetConfirmOpen] = useState(false);

      // Fetch updates from Cloudflare D1 API Function (/api/sync)
      const fetchD1Sync = async (code) => {
        if (!code) return;
        try {
          const res = await fetch(`/api/sync?code=${encodeURIComponent(code)}`);
          if (res.ok) {
            const result = await res.json();
            if (result.exists && result.payload) {
              isRemoteUpdateRef.current = true;
              setData(result.payload);
              setSyncStatus('connected');
              setLastSyncedTime(new Date(result.updatedAt || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            } else {
              // Database row doesn't exist yet for this passcode, upload current data to initialize it
              fetch('/api/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code, payload: data })
              });
              setSyncStatus('connected');
            }
            isInitialSyncDoneRef.current = true;
          }
        } catch (err) {
          console.log("Cloudflare D1 endpoint error:", err);
        }
      };

      // Periodic Cloudflare D1 Poll
      useEffect(() => {
        if (!syncPasscode.trim()) {
          setSyncStatus('local');
          return;
        }

        setSyncStatus('connecting');
        fetchD1Sync(syncPasscode.trim());

        const interval = setInterval(() => {
          fetchD1Sync(syncPasscode.trim());
        }, 8000);

        return () => clearInterval(interval);
      }, [syncPasscode]);

      // Save to LocalStorage and push changes to D1 ONLY when user modifies data
      useEffect(() => {
        localStorage.setItem('home_hub_data_v2', JSON.stringify(data));

        if (isRemoteUpdateRef.current) {
          isRemoteUpdateRef.current = false;
          return;
        }

        if (syncPasscode.trim() && isInitialSyncDoneRef.current) {
          fetch('/api/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: syncPasscode.trim(), payload: data })
          }).then(res => {
            if (res.ok) {
              setSyncStatus('connected');
              setLastSyncedTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
          }).catch(() => {});
        }
      }, [data]);

      const handleSavePasscode = (code) => {
        const trimmed = code.trim();
        isInitialSyncDoneRef.current = false;
        setSyncPasscode(trimmed);
        localStorage.setItem('home_hub_sync_code', trimmed);
        if (!trimmed) {
          setSyncStatus('local');
          showToast('Switched to Local Mode');
        } else {
          showToast(`Connected to Cloud sync with passcode "${trimmed}"`);
          fetchD1Sync(trimmed);
        }
      };

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('home_hub_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('home_hub_theme', 'light');
        }
      }, [darkMode]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3200);
      };

      const handleResetData = () => {
        setData(INITIAL_DATA);
        setResetConfirmOpen(false);
        showToast('All household data reset to sample state!');
      };

      const handleExportData = () => {
        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(data, null, 2))}`;
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', jsonString);
        downloadAnchor.setAttribute('download', `home_hub_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Backup downloaded successfully!');
      };

      const handleImportData = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed && parsed.chores && parsed.recipes) {
                setData(parsed);
                showToast('Household data imported successfully!');
              } else {
                showToast('Invalid backup file format.', 'error');
              }
            } catch (err) {
              showToast('Failed to parse uploaded JSON.', 'error');
            }
          };
        }
      };

      const handleAddIngredientsToGroceries = (recipe) => {
        if (!recipe || !recipe.ingredients) return;
        const newGroceries = [...data.groceries];
        let addedCount = 0;

        recipe.ingredients.forEach(ing => {
          const cleanName = ing.trim();
          if (cleanName) {
            newGroceries.push({
              id: 'g_' + Date.now() + Math.random().toString(36).substr(2, 4),
              name: cleanName,
              quantity: '1',
              category: 'Pantry',
              completed: false
            });
            addedCount++;
          }
        });

        setData({ ...data, groceries: newGroceries });
        showToast(`Added ${addedCount} ingredients from "${recipe.title}" to Grocery List!`);
      };

      const unpaidBills = useMemo(() => data.bills.filter(b => !b.paid), [data.bills]);
      const pendingChoresCount = useMemo(() => data.chores.filter(c => !c.completed).length, [data.chores]);
      const activeGroceryCount = useMemo(() => data.groceries.filter(g => !g.completed).length, [data.groceries]);
      const familyPetsCount = useMemo(() => ((data.family || []).length + (data.pets || []).length), [data.family, data.pets]);

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-gauge-high' },
        { id: 'chores', label: 'Chores', icon: 'fa-list-check', badge: pendingChoresCount },
        { id: 'family', label: 'Family', icon: 'fa-people-roof', badge: familyPetsCount },
        { id: 'recipes', label: 'Meal Planner', icon: 'fa-utensils' },
        { id: 'groceries', label: 'Shopping', icon: 'fa-cart-shopping', badge: activeGroceryCount },
        { id: 'bills', label: 'Bills', icon: 'fa-wallet', badge: unpaidBills.length },
        { id: 'homeSpecs', label: 'Home Specs', icon: 'fa-house-user' },
        { id: 'contacts', label: 'Contacts', icon: 'fa-address-book' },
      ];

      // --- LOGIN SCREEN IF NO USER SELECTED ---
      if (!currentUser) {
        return (
          <React.Fragment>
            <LoginView 
              family={data.family || INITIAL_DATA.family}
              onSelectUser={(u) => {
                setCurrentUser(u);
                localStorage.setItem('home_hub_active_user', JSON.stringify(u));
                showToast(`Logged in as ${u.name}`);
              }}
              setMemberModal={setMemberModal}
              setSyncModalOpen={setSyncModalOpen}
              syncStatus={syncStatus}
              syncPasscode={syncPasscode}
            />

            {toast && (
              <div className={`fixed bottom-5 right-5 z-50 flex items-center space-x-3 px-4 py-3 rounded-xl shadow-xl text-white text-sm font-medium transition-all transform duration-200 ${
                toast.type === 'error' ? 'bg-red-600' : 'bg-slate-900 dark:bg-brand-600 border border-slate-700'
              }`}>
                <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check text-brand-400 dark:text-white'}`}></i>
                <span>{toast.message}</span>
              </div>
            )}

            {syncModalOpen && (
              <SyncModal 
                passcode={syncPasscode}
                onSavePasscode={handleSavePasscode}
                onClose={() => setSyncModalOpen(false)}
                status={syncStatus}
                lastSyncedTime={lastSyncedTime}
              />
            )}

            {memberModal.open && (
              <MemberModal 
                item={memberModal.item}
                onClose={() => setMemberModal({ open: false, item: null })}
                onSave={(savedMember) => {
                  let updated = [...(data.family || [])];
                  if (memberModal.item) {
                    updated = updated.map(m => m.id === savedMember.id ? savedMember : m);
                    showToast('Family member profile updated');
                  } else {
                    updated.unshift({ ...savedMember, id: 'fm_' + Date.now() });
                    showToast('New family member added');
                  }
                  setData({ ...data, family: updated });
                  setMemberModal({ open: false, item: null });
                }}
              />
            )}
          </React.Fragment>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-900">
          <aside className="hidden md:flex md:flex-col md:w-64 bg-white dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 z-20">
            <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                  <i className="fa-solid fa-house text-lg"></i>
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 dark:text-white tracking-tight leading-none text-lg">Home Hub</h1>
                  <span className="text-xs text-brand-600 dark:text-brand-400 font-semibold">Household OS</span>
                </div>
              </div>
            </div>

            {currentUser && (
              <div className="px-4 py-3 bg-slate-100 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <div className="flex items-center space-x-2.5 min-w-0">
                  <div className="w-8 h-8 rounded-lg bg-brand-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0">
                    {currentUser.name.charAt(0)}
                  </div>
                  <div className="truncate">
                    <p className="text-xs font-bold text-slate-900 dark:text-white truncate">{currentUser.name}</p>
                    <p className="text-[10px] text-slate-500 dark:text-slate-400 truncate">{currentUser.relation}</p>
                  </div>
                </div>
                <button 
                  onClick={() => { setCurrentUser(null); localStorage.removeItem('home_hub_active_user'); }}
                  className="p-1.5 text-slate-400 hover:text-red-500 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition text-xs flex-shrink-0"
                  title="Switch Profile / Logout"
                >
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>
            )}

            <div className="px-4 py-2 bg-slate-50 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800">
              <button 
                onClick={() => setSyncModalOpen(true)}
                className="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
              >
                <div className="flex items-center space-x-2 truncate pr-1">
                  <span className={`w-2 h-2 rounded-full flex-shrink-0 ${syncPasscode ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`}></span>
                  <span className="text-slate-700 dark:text-slate-200 truncate">
                    {syncPasscode ? `Sync: ${syncPasscode}` : 'Set Cloud Sync Passcode'}
                  </span>
                </div>
                <i className="fa-solid fa-cloud text-brand-600 dark:text-brand-400 flex-shrink-0"></i>
              </button>
            </div>

            <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 ${
                    activeTab === item.id 
                      ? 'bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-400 font-semibold shadow-sm' 
                      : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <i className={`fa-solid ${item.icon} w-5 text-center text-base ${activeTab === item.id ? 'text-brand-600 dark:text-brand-400' : 'text-slate-400'}`}></i>
                    <span>{item.label}</span>
                  </div>
                  {item.badge > 0 && (
                    <span className={`px-2 py-0.5 text-xs rounded-full font-semibold ${
                      activeTab === item.id 
                        ? 'bg-brand-600 text-white' 
                        : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'
                    }`}>
                      {item.badge}
                    </span>
                  )}
                </button>
              ))}
            </nav>

            <div className="p-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
              <div className="flex items-center justify-between px-2 py-1">
                <span className="text-xs font-medium text-slate-500 dark:text-slate-400">Appearance</span>
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                  title="Toggle Theme"
                >
                  <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>
                </button>
              </div>

              <div className="pt-2 flex items-center justify-between text-xs text-slate-400 border-t border-slate-100 dark:border-slate-800/60 px-2">
                <button onClick={handleExportData} className="hover:text-brand-600 transition flex items-center gap-1">
                  <i className="fa-solid fa-download"></i> Backup
                </button>
                <label className="hover:text-brand-600 transition flex items-center gap-1 cursor-pointer">
                  <i className="fa-solid fa-upload"></i> Restore
                  <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                </label>
                <button onClick={() => setResetConfirmOpen(true)} className="hover:text-red-500 transition flex items-center gap-1">
                  <i className="fa-solid fa-rotate-left"></i> Reset
                </button>
              </div>
            </div>
          </aside>

          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header className="md:hidden bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 p-4 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white">
                  <i className="fa-solid fa-house text-sm"></i>
                </div>
                <span className="font-bold text-slate-900 dark:text-white">Home Hub</span>
                {currentUser && (
                  <span className="text-xs bg-slate-100 dark:bg-slate-800 text-brand-600 dark:text-brand-400 font-semibold px-2 py-0.5 rounded-full ml-1">
                    {currentUser.name.split(' ')[0]}
                  </span>
                )}
              </div>

              <div className="flex items-center space-x-1">
                {currentUser && (
                  <button 
                    onClick={() => { setCurrentUser(null); localStorage.removeItem('home_hub_active_user'); }}
                    className="p-2 text-slate-500 hover:text-red-500 text-xs"
                    title="Switch User / Logout"
                  >
                    <i className="fa-solid fa-right-from-bracket"></i>
                  </button>
                )}
                <button 
                  onClick={() => setSyncModalOpen(true)}
                  className="p-2 text-slate-600 dark:text-slate-300 relative"
                  title="Household Sync"
                >
                  <i className="fa-solid fa-cloud"></i>
                  {syncPasscode && <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-emerald-500"></span>}
                </button>
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 text-slate-600 dark:text-slate-300"
                >
                  <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon'}`}></i>
                </button>
                <button 
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2 text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"
                >
                  <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-xl`}></i>
                </button>
              </div>
            </header>

            {mobileMenuOpen && (
              <div className="md:hidden bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 p-4 space-y-1 z-30">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setMobileMenuOpen(false); }}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium ${
                      activeTab === item.id ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400' : 'text-slate-600 dark:text-slate-400'
                    }`}
                  >
                    <div className="flex items-center space-x-3">
                      <i className={`fa-solid ${item.icon}`}></i>
                      <span>{item.label}</span>
                    </div>
                    {item.badge > 0 && (
                      <span className="bg-brand-600 text-white text-xs px-2 py-0.5 rounded-full">{item.badge}</span>
                    )}
                  </button>
                ))}
                <div className="pt-2 mt-2 border-t border-slate-200 dark:border-slate-800 flex justify-around text-xs text-slate-500">
                  <button onClick={handleExportData}><i className="fa-solid fa-download"></i> Backup</button>
                  <button onClick={() => setResetConfirmOpen(true)} className="text-red-500"><i className="fa-solid fa-rotate-left"></i> Reset</button>
                </div>
              </div>
            )}

            <main className="flex-1 overflow-y-auto p-4 md:p-8">
              {activeTab === 'dashboard' && (
                <DashboardView 
                  data={data} 
                  setData={setData}
                  setActiveTab={setActiveTab}
                  setChoreModal={setChoreModal}
                  setBillModal={setBillModal}
                  showToast={showToast}
                  currentUser={currentUser}
                />
              )}

              {activeTab === 'chores' && (
                <ChoresView 
                  chores={data.chores} 
                  setChores={(newChores) => setData({ ...data, chores: newChores })}
                  setChoreModal={setChoreModal}
                  showToast={showToast}
                />
              )}

              {activeTab === 'family' && (
                <FamilyView 
                  family={data.family || INITIAL_DATA.family}
                  setFamily={(nf) => setData({ ...data, family: nf })}
                  pets={data.pets || INITIAL_DATA.pets}
                  setPets={(np) => setData({ ...data, pets: np })}
                  setMemberModal={setMemberModal}
                  setPetModal={setPetModal}
                  showToast={showToast}
                />
              )}

              {activeTab === 'recipes' && (
                <RecipesView 
                  recipes={data.recipes}
                  setRecipes={(newRecipes) => setData({ ...data, recipes: newRecipes })}
                  mealPlan={data.mealPlan}
                  setMealPlan={(newPlan) => setData({ ...data, mealPlan: newPlan })}
                  setRecipeModal={setRecipeModal}
                  setRecipeDetailModal={setRecipeDetailModal}
                  handleAddIngredientsToGroceries={handleAddIngredientsToGroceries}
                  showToast={showToast}
                />
              )}

              {activeTab === 'groceries' && (
                <GroceryView 
                  groceries={data.groceries}
                  setGroceries={(newGroceries) => setData({ ...data, groceries: newGroceries })}
                  inventory={data.inventory || INITIAL_DATA.inventory}
                  setInventory={(newInventory) => setData({ ...data, inventory: newInventory })}
                  showToast={showToast}
                />
              )}

              {activeTab === 'bills' && (
                <BillsView 
                  bills={data.bills}
                  setBills={(newBills) => setData({ ...data, bills: newBills })}
                  setBillModal={setBillModal}
                  showToast={showToast}
                />
              )}

              {activeTab === 'homeSpecs' && (
                <HomeSpecsView 
                  homeNotes={data.homeNotes}
                  setHomeNotes={(nh) => setData({ ...data, homeNotes: nh })}
                  setNoteModal={setNoteModal}
                  showToast={showToast}
                />
              )}

              {activeTab === 'contacts' && (
                <ContactsView 
                  contacts={data.contacts}
                  setContacts={(nc) => setData({ ...data, contacts: nc })}
                  setContactModal={setContactModal}
                  showToast={showToast}
                />
              )}
            </main>
          </div>

          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 flex items-center space-x-3 px-4 py-3 rounded-xl shadow-xl text-white text-sm font-medium transition-all transform duration-200 ${
              toast.type === 'error' ? 'bg-red-600' : 'bg-slate-900 dark:bg-brand-600 border border-slate-700'
            }`}>
              <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check text-brand-400 dark:text-white'}`}></i>
              <span>{toast.message}</span>
            </div>
          )}

          {syncModalOpen && (
            <SyncModal 
              passcode={syncPasscode}
              onSavePasscode={handleSavePasscode}
              onClose={() => setSyncModalOpen(false)}
              status={syncStatus}
              lastSyncedTime={lastSyncedTime}
            />
          )}

          {choreModal.open && (
            <ChoreModal 
              item={choreModal.item} 
              onClose={() => setChoreModal({ open: false, item: null })}
              onSave={(savedItem) => {
                let updated = [...data.chores];
                if (choreModal.item) {
                  updated = updated.map(c => c.id === savedItem.id ? savedItem : c);
                  showToast('Chore updated successfully');
                } else {
                  updated.unshift({ ...savedItem, id: 'c_' + Date.now() });
                  showToast('New chore added');
                }
                setData({ ...data, chores: updated });
                setChoreModal({ open: false, item: null });
              }}
            />
          )}

          {memberModal.open && (
            <MemberModal 
              item={memberModal.item}
              onClose={() => setMemberModal({ open: false, item: null })}
              onSave={(savedMember) => {
                let updated = [...(data.family || [])];
                if (memberModal.item) {
                  updated = updated.map(m => m.id === savedMember.id ? savedMember : m);
                  showToast('Family member profile updated');
                } else {
                  updated.unshift({ ...savedMember, id: 'fm_' + Date.now() });
                  showToast('New family member added');
                }
                setData({ ...data, family: updated });
                setMemberModal({ open: false, item: null });
              }}
            />
          )}

          {petModal.open && (
            <PetModal 
              item={petModal.item}
              onClose={() => setPetModal({ open: false, item: null })}
              onSave={(savedPet) => {
                let updated = [...(data.pets || [])];
                if (petModal.item) {
                  updated = updated.map(p => p.id === savedPet.id ? savedPet : p);
                  showToast('Pet profile updated');
                } else {
                  updated.unshift({ ...savedPet, id: 'p_' + Date.now() });
                  showToast('New pet profile added');
                }
                setData({ ...data, pets: updated });
                setPetModal({ open: false, item: null });
              }}
            />
          )}

          {recipeModal.open && (
            <RecipeModal 
              item={recipeModal.item}
              onClose={() => setRecipeModal({ open: false, item: null })}
              onSave={(savedRecipe) => {
                let updated = [...data.recipes];
                if (recipeModal.item) {
                  updated = updated.map(r => r.id === savedRecipe.id ? savedRecipe : r);
                  showToast('Recipe updated');
                } else {
                  updated.unshift({ ...savedRecipe, id: 'r_' + Date.now() });
                  showToast('New recipe added');
                }
                setData({ ...data, recipes: updated });
                setRecipeModal({ open: false, item: null });
              }}
            />
          )}

          {recipeDetailModal.open && recipeDetailModal.recipe && (
            <RecipeDetailModal 
              recipe={recipeDetailModal.recipe}
              onClose={() => setRecipeDetailModal({ open: false, recipe: null })}
              onAddIngredients={() => handleAddIngredientsToGroceries(recipeDetailModal.recipe)}
            />
          )}

          {billModal.open && (
            <BillModal 
              item={billModal.item}
              onClose={() => setBillModal({ open: false, item: null })}
              onSave={(savedBill) => {
                let updated = [...data.bills];
                if (billModal.item) {
                  updated = updated.map(b => b.id === savedBill.id ? savedBill : b);
                  showToast('Bill record updated');
                } else {
                  updated.unshift({ ...savedBill, id: 'b_' + Date.now() });
                  showToast('New bill added');
                }
                setData({ ...data, bills: updated });
                setBillModal({ open: false, item: null });
              }}
            />
          )}

          {contactModal.open && (
            <ContactModal 
              item={contactModal.item}
              onClose={() => setContactModal({ open: false, item: null })}
              onSave={(savedCt) => {
                let updated = [...data.contacts];
                if (contactModal.item) {
                  updated = updated.map(c => c.id === savedCt.id ? savedCt : c);
                  showToast('Contact updated');
                } else {
                  updated.unshift({ ...savedCt, id: 'ct_' + Date.now() });
                  showToast('Emergency contact added');
                }
                setData({ ...data, contacts: updated });
                setContactModal({ open: false, item: null });
              }}
            />
          )}

          {noteModal.open && (
            <NoteModal 
              item={noteModal.item}
              onClose={() => setNoteModal({ open: false, item: null })}
              onSave={(savedNote) => {
                let updated = [...data.homeNotes];
                if (noteModal.item) {
                  updated = updated.map(n => n.id === savedNote.id ? savedNote : n);
                  showToast('Home note updated');
                } else {
                  updated.unshift({ ...savedNote, id: 'hn_' + Date.now() });
                  showToast('Home note card added');
                }
                setData({ ...data, homeNotes: updated });
                setNoteModal({ open: false, item: null });
              }}
            />
          )}

          {resetConfirmOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
                <div className="w-12 h-12 rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 flex items-center justify-center text-xl mb-4">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 className="text-lg font-bold text-slate-900 dark:text-white">Reset Data to Default?</h3>
                <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">
                  This action will override all your current custom chores, family profiles, recipes, bills, and groceries with the initial sample data set.
                </p>
                <div className="flex justify-end space-x-3 mt-6">
                  <button 
                    onClick={() => setResetConfirmOpen(false)}
                    className="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={handleResetData}
                    className="px-4 py-2 text-sm font-medium bg-red-600 hover:bg-red-700 text-white rounded-xl shadow"
                  >
                    Yes, Reset Everything
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
